[project]
name = "fa-coach"
version = "0.1.0"
description = "The coach: Telegram bot and scheduler that watches MFP and Hevy data (through fa-api) and proposes plan changes"
requires-python = ">=3.13"
# Its own project (like bot/): the Anthropic SDK and python-telegram-bot stay
# free of mfp-mcp's exact pins. The coach reaches MFP and Hevy only through
# fa-api (REST on :8000, MCP tools on :8001).
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
]

[project.scripts]
fa-coach = "fa_coach.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_coach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

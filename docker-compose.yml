# docker compose up -d --build
#
# Everything that must survive a rebuild or a move lives in ./state (gitignored):
#   state/mfp, state/hevy   MFP session + auto-refresh profile, Hevy tokens
#   state/bot               pending cards, short chat memory, usage.jsonl
#   state/coach             coach.db (only the coach opens it), photos
# Moving to another machine = repo + .env + state/.
#
# FA_IMAGE names the one image every service uses (default
# fitness-aggregator:latest). A second checkout or worktree sets its own tag,
# e.g. FA_IMAGE=fitness-aggregator:mybranch, so its builds and tests don't
# replace the image the running services use.

x-app: &app
  image: ${FA_IMAGE:-fitness-aggregator:latest}
  restart: unless-stopped
  volumes:
    - ./state:/app/state
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  # The only process that uses the MFP session: REST API + UI on :8000, and the
  # MFP/Hevy MCP tools on :8001 for the bot and for Claude Code on the host
  # (.mcp.json). :8001 is published on the host's 127.0.0.1 only: whatever
  # reaches it can write to the diary.
  api:
    <<: *app
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["fa-api"]
    environment:
      MFP_USERNAME: ${MFP_USERNAME:?set MFP_USERNAME in .env}
      TZ: ${TZ:-Europe/Vienna}
      FA_HOST: 0.0.0.0
      FA_TOOLS_HOST: 0.0.0.0
    # Localhost by default. On the server set FA_BIND to its Tailscale IP
    # (100.x.y.z) so the UI is reachable only inside the tailnet.
    ports:
      - "${FA_BIND:-127.0.0.1}:${FA_PORT:-8000}:8000"
      - "127.0.0.1:${FA_TOOLS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Telegram bot. Only one process may poll a bot token.
  bot:
    <<: *app
    pull_policy: never  # same image as api
    depends_on:
      api: { condition: service_healthy }
    command: ["/app/bot/.venv/bin/fa-bot"]
    environment:
      TZ: ${TZ:-Europe/Vienna}
      FA_TOOLS_URL: http://api:8001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?set TELEGRAM_ALLOWED_USER_ID in .env}
      BOT_MODEL: ${BOT_MODEL:-anthropic:claude-sonnet-5-5}
      # Only the key for BOT_MODEL's provider is needed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional: a proxy or an OpenAI-compatible server (OpenRouter, Ollama,
      # LiteLLM, ...). Empty = the provider's default.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}

  # The coach. Its own Telegram bot (only one process may poll a token), its
  # own database in state/coach. Reaches MFP and Hevy only through the api.
  coach:
    <<: *app
    pull_policy: never  # same image as api
    depends_on:
      api: { condition: service_healthy }
    command: ["/app/coach/.venv/bin/fa-coach"]
    environment:
      TZ: ${TZ:-Europe/Vienna}
      FA_API_URL: http://api:8000
      FA_TOOLS_URL: http://api:8001
      COACH_TELEGRAM_BOT_TOKEN: ${COACH_TELEGRAM_BOT_TOKEN:?set COACH_TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?set TELEGRAM_ALLOWED_USER_ID in .env}
      COACH_MODEL: ${COACH_MODEL:-claude-sonnet-5-5}
      COACH_DECISION_MODEL: ${COACH_DECISION_MODEL:-claude-opus-5-5}
      # Empty = the shared ANTHROPIC_* values below.
      COACH_ANTHROPIC_API_KEY: ${COACH_ANTHROPIC_API_KEY:-}
      COACH_ANTHROPIC_BASE_URL: ${COACH_ANTHROPIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}

  # Food bot tests, coach tests and the coach-skills validator against the
  # working tree (sources and tests mounted), no network:
  #   docker compose run --rm test
  test:
    image: ${FA_IMAGE:-fitness-aggregator:latest}
    pull_policy: never
    profiles: [dev]
    network_mode: none
    working_dir: /app
    volumes:
      - ./bot/src:/app/bot/src:ro
      - ./bot/tests:/app/bot/tests:ro
      - ./coach/src:/app/coach/src:ro
      - ./coach/tests:/app/coach/tests:ro
      - ./coach/coach-skills:/app/coach/coach-skills:ro
    command:
      - sh
      - -c
      - >-
        cd /app/bot && .venv/bin/pytest -q -p no:cacheprovider &&
        cd /app/coach && .venv/bin/pytest -q -p no:cacheprovider
